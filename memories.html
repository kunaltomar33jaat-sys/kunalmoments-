<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memories - Kunal Moments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>PRIVATE MEMORIES</h1>

        <p>Enter the password to continue.</p>

        <input type="password" placeholder="Enter password">

        <br><br>

        <button onclick="unlockMemories()">Unlock Memories</button>

        <div class="gallery">

            <div class="memory-card">
                <div class="placeholder">PHOTO</div>

                <h2>School Memories</h2>

                <p>A moment worth remembering.</p>
            </div>

            <div class="memory-card">
                <div class="placeholder">VIDEO</div>

                <h2>Friends</h2>

                <p>Good times with good people.</p>
            </div>

        </div>

    </div>

    <script>
        function unlockMemories() {
            alert("Password system will be connected securely later.");
        }
    </script>

</body>
</html>
