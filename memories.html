<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Private Memories - Kunal Moments</title>

    <link rel="stylesheet"
        href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

</head>


<body>

    <div class="container">

        <h1>PRIVATE MEMORIES</h1>

        <p>Login to view your memories.</p>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <br>

        <input
            type="password"
            id="password"
            placeholder="Password">

        <br><br>

        <button id="loginButton">
            Login
        </button>

        <p id="message"></p>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gtbrnbpqyjywtdxxvois.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_pbRIkluFEhLo9t8rBM7D9w_YG6q78o4";


        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        loginButton.addEventListener(
            "click",
            async function () {

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                if (!email || !password) {

                    message.textContent =
                        "Please enter email and password.";

                    return;
                }


                message.textContent =
                    "Logging in...";


                const result =
                    await client.auth.signInWithPassword({

                        email: email,
                        password: password

                    });


                if (result.error) {

                    message.textContent =
                        "ERROR: " +
                        result.error.message;

                    return;
                }


                message.textContent =
                    "LOGIN SUCCESSFUL!";

            }
        );

    </script>

</body>

</html>
