<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Private Memories - Kunal Moments</title>

    <link rel="stylesheet"
        href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

</head>


<body>

    <div class="container">

        <h1>PRIVATE MEMORIES</h1>

        <p>Login to view your memories.</p>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <br>

        <input
            type="password"
            id="password"
            placeholder="Password">

        <br><br>

        <button id="loginButton">
            Login
        </button>

        <p id="message"></p>

        <div id="gallery"
            class="gallery">
        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gtbrnbpqyjywtdxxvois.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_pbRIkluFEhLo9t8rBM7D9w_YG6q78o4";


        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const gallery =
            document.getElementById("gallery");


        loginButton.addEventListener(
            "click",
            async function () {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    message.textContent =
                        "Please enter email and password.";

                    return;
                }


                message.textContent =
                    "Logging in...";


                try {

                    const { error } =
                        await client.auth.signInWithPassword({

                            email: email,
                            password: password

                        });


                    if (error) {

                        message.textContent =
                            "ERROR: " +
                            error.message;

                        return;
                    }


                    message.textContent =
                        "LOGIN SUCCESSFUL!";


                    await loadMemories();


                } catch (error) {

                    message.textContent =
                        "ERROR: " +
                        error.message;

                }

            }
        );


        async function loadMemories() {

            gallery.innerHTML =
                "<p>Loading memories...</p>";


            const { data, error } =
                await client.storage
                    .from("memories")
                    .list();


            if (error) {

                gallery.innerHTML =
                    "<p>STORAGE ERROR: " +
                    error.message +
                    "</p>";

                return;
            }


            if (!data || data.length === 0) {

                gallery.innerHTML =
                    "<p>No memories found.</p>";

                return;
            }


            gallery.innerHTML = "";


            for (const file of data) {

                if (!file.name) {
                    continue;
                }


                const { data: signedData, error: signedError } =
                    await client.storage
                        .from("memories")
                        .createSignedUrl(
                            file.name,
                            3600
                        );


                if (signedError) {
                    continue;
                }


                if (!signedData) {
                    continue;
                }


                const card =
                    document.createElement("div");

                card.className =
                    "memory-card";


                const image =
                    document.createElement("img");

                image.src =
                    signedData.signedUrl;

                image.alt =
                    "Kunal Moment";


                image.style.width =
                    "100%";

                image.style.borderRadius =
                    "10px";

                image.style.display =
                    "block";


                const title =
                    document.createElement("h2");

                title.textContent =
                    file.name;


                const caption =
                    document.createElement("p");

                caption.textContent =
                    "A special Kunal Moment ❤️";


                card.appendChild(image);

                card.appendChild(title);

                card.appendChild(caption);

                gallery.appendChild(card);

            }

        }

    </script>

</body>

</html>
