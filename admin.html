<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Kunal Moments</title>

    <link rel="stylesheet"
        href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

</head>


<body>

    <div class="container">

        <h1>ADMIN PANEL</h1>

        <p>Manage your memories.</p>

        <br>

        <a href="index.html"
            class="btn">
            Back to Home
        </a>


        <div class="admin-box">

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email">

            <br><br>

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin Password">

            <br><br>

            <button onclick="adminLogin()">
                Admin Login
            </button>

            <p id="adminMessage"></p>


            <hr>


            <h2>Add New Memory</h2>


            <input
                type="text"
                id="memoryTitle"
                placeholder="Memory title">

            <br><br>


            <input
                type="text"
                id="memoryCaption"
                placeholder="Caption">

            <br><br>


            <input
                type="file"
                id="memoryFile"
                accept="image/*,video/*">

            <br><br>


            <button onclick="addMemory()">
                Add Memory
            </button>

            <p id="uploadMessage"></p>

        </div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://gtbrnbpqyjywtdxxvois.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_pbRIkluFEhLo9t8rBM7D9w_YG6q78o4";


        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function adminLogin() {

            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;

            const message =
                document.getElementById(
                    "adminMessage"
                );


            if (!email || !password) {

                message.textContent =
                    "Please enter email and password.";

                return;
            }


            message.textContent =
                "Logging in...";


            const { error } =
                await client.auth.signInWithPassword({

                    email: email,
                    password: password

                });


            if (error) {

                message.textContent =
                    "ERROR: " +
                    error.message;

                return;
            }


            message.textContent =
                "ADMIN LOGIN SUCCESSFUL!";

        }


        async function addMemory() {

            const uploadMessage =
                document.getElementById(
                    "uploadMessage"
                );


            const title =
                document
                    .getElementById("memoryTitle")
                    .value
                    .trim();


            const caption =
                document
                    .getElementById("memoryCaption")
                    .value
                    .trim();


            const file =
                document
                    .getElementById("memoryFile")
                    .files[0];


            if (!file) {

                uploadMessage.textContent =
                    "Please choose a file.";

                return;
            }


            if (!title) {

                uploadMessage.textContent =
                    "Please enter a memory title.";

                return;
            }


            uploadMessage.textContent =
                "Uploading...";


            const filePath =
                crypto.randomUUID() +
                "-" +
                file.name;


            const { error: uploadError } =
                await client.storage
                    .from("memories")
                    .upload(
                        filePath,
                        file
                    );


            if (uploadError) {

                uploadMessage.textContent =
                    "UPLOAD ERROR: " +
                    uploadError.message;

                return;
            }


            const { error: databaseError } =
                await client
                    .from("memories")
                    .insert({

                        title: title,

                        caption: caption,

                        file_path: filePath

                    });


            if (databaseError) {

                uploadMessage.textContent =
                    "DATABASE ERROR: " +
                    databaseError.message;

                return;
            }


            uploadMessage.textContent =
                "MEMORY SAVED SUCCESSFULLY!";


            document
                .getElementById("memoryTitle")
                .value = "";


            document
                .getElementById("memoryCaption")
                .value = "";


            document
                .getElementById("memoryFile")
                .value = "";

        }

    </script>

</body>

</html>
